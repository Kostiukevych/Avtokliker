<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чёрная дыра — оверлей-кнопка</title>
<style>
  :root {
    --ember: #ff7a18;
    --gold:  #ffd27a;
    --white: #fff6e6;
    --rust:  #b43a0a;
    --lime:  #b6ff3a;          /* неоновый салатовый */
    --lime-glow: #7dff1a;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; background: transparent !important; overflow: hidden; }
  /* режим «кнопка в приложении»: без панели настроек, дыра по центру, диск и джеты помещаются целиком */
  .panel, .backdrop { display: none !important; }
  .bh { left: 50% !important; top: 50% !important; --s: 38vmin; }

  /* ---------- кнопка (фиксированная, поверх экрана) ---------- */
  .bh {
    --s: var(--size, 54px);                       /* размер кнопки */
    position: fixed;
    left: 80%; top: 30%;                          /* стартовая точка, дальше двигает JS */
    translate: -50% -50%;
    z-index: 30;
    width: var(--s);
    height: var(--s);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  }
  .bh > * { position: absolute; pointer-events: none; }
  .bh::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 190%; height: 56%;
    translate: -50% -50%;
    rotate: -14deg;
    border-radius: 50%;
  }
  .bh:active { transform: scale(.92); }

  .infall { left: 50%; top: 50%; translate: -50% -50%; }

  .jet {
    left: 50%; top: 50%;
    width: 7%; height: 170%;
    translate: -50% -50%;
    rotate: -14deg;
    background: linear-gradient(to bottom,
      transparent 0%, rgba(120,180,255,0) 8%, rgba(150,200,255,.35) 34%,
      rgba(235,246,255,.8) 50%, rgba(150,200,255,.35) 66%, rgba(120,180,255,0) 92%, transparent 100%);
    -webkit-mask: linear-gradient(to right, transparent, #000 50%, transparent);
            mask: linear-gradient(to right, transparent, #000 50%, transparent);
    filter: blur(1.5px);
    opacity: .5;
    animation: jet 3.4s ease-in-out infinite;
  }
  @keyframes jet { 0%, 100% { opacity: .3; } 50% { opacity: .75; } }

  .disk {
    left: 50%; top: 50%;
    width: 200%; height: 200%;
    translate: -50% -50%;
    transform: rotate(-14deg) scaleY(.26);
    clip-path: inset(0 0 50% 0);
  }
  .disk.front { clip-path: inset(50% 0 0 0); }
  .disk i {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      var(--rust), var(--ember), var(--gold), var(--white),
      var(--gold), var(--ember), #4a1200 70%, var(--rust));
    -webkit-mask: radial-gradient(circle, transparent 36%, #000 41%, #000 58%, transparent 70%);
            mask: radial-gradient(circle, transparent 36%, #000 41%, #000 58%, transparent 70%);
    filter: blur(1px) saturate(1.2);
    will-change: transform;
  }

  .lens {
    left: 50%; top: 50%;
    width: 60%; height: 60%;
    translate: -50% -50%;
    border-radius: 50%;
    background: conic-gradient(
      var(--ember), var(--gold), var(--white), var(--gold), var(--ember), var(--rust), var(--ember));
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 68%, #000 72%, transparent 100%);
            mask: radial-gradient(circle, transparent 62%, #000 68%, #000 72%, transparent 100%);
    filter: blur(1.2px) drop-shadow(0 0 8px #ff8a2a);
    will-change: transform;
  }

  .core {
    left: 50%; top: 50%;
    width: 44%; height: 44%;
    translate: -50% -50%;
    border-radius: 50%;
    background: #000;
    box-shadow:
      0 0 0 1.5px #ffe2b8cc,
      0 0 14px 3px #ff8a2a99,
      0 0 50px 14px #ff5a1440,
      inset 0 0 16px 4px #000;
    transition: box-shadow .25s;
  }

  /* ---------- неоновый салатовый контур по краю чёрного круга ---------- */
  .ring {
    left: 50%; top: 50%;
    width: 44%; height: 44%;
    translate: -50% -50%;
    border-radius: 50%;
    border: 2px solid var(--lime);
    box-shadow:
      0 0 4px 1px var(--lime),
      0 0 12px 3px #7dff1acc,
      0 0 26px 6px #7dff1a66,
      inset 0 0 8px 2px #7dff1a99;
    opacity: 0;
    transition: opacity .18s;
  }
  .bh:active .ring,
  .bh.open .ring,
  .bh.ring-always .ring { opacity: 1; }

  .ripple {
    left: 50%; top: 50%;
    width: 44%; height: 44%;
    translate: -50% -50%;
    border: 2px solid var(--lime);
    border-radius: 50%;
    opacity: 0;
  }
  .bh.go .ripple { animation: ripple .8s ease-out; }
  .bh.go .core   { animation: squeeze .6s cubic-bezier(.3, 0, .2, 1); }
  @keyframes ripple  { from { transform: scale(1); opacity: .95; } to { transform: scale(6); opacity: 0; } }
  @keyframes squeeze {
    0%   { scale: 1; }
    35%  { scale: .75; }
    70%  { scale: 1.08; }
    100% { scale: 1; }
  }

  /* ---------- окно настроек ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed; z-index: 25;
    left: 50%; top: 50%;
    width: min(88vw, 320px);
    translate: -50% -50%;
    scale: .92;
    padding: 18px 18px 14px;
    border-radius: 20px;
    background: rgba(14, 16, 22, .94);
    border: 1px solid rgba(182, 255, 58, .45);
    box-shadow: 0 0 0 1px rgba(182, 255, 58, .08), 0 0 28px rgba(125, 255, 26, .22), 0 18px 50px rgba(0, 0, 0, .6);
    color: #e9f3dc;
    font: 15px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, scale .25s cubic-bezier(.2, .8, .2, 1);
  }
  .panel.show { opacity: 1; scale: 1; pointer-events: auto; }

  .panel h2 {
    margin: 0 0 12px;
    font-size: 17px; font-weight: 650;
    color: var(--lime);
    text-shadow: 0 0 10px rgba(125, 255, 26, .55);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, .07); }
  .col { display: block; }
  .col > div { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .col output { color: var(--lime); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: rgba(255, 255, 255, .15); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #0b0d12; border: 2px solid var(--lime);
    box-shadow: 0 0 8px var(--lime-glow);
  }

  .sw { position: relative; width: 46px; height: 26px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw span {
    position: absolute; inset: 0; border-radius: 26px;
    background: rgba(255, 255, 255, .16); transition: background .2s, box-shadow .2s;
  }
  .sw span::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: translate .2s, background .2s;
  }
  .sw input:checked + span { background: rgba(182, 255, 58, .35); box-shadow: 0 0 10px rgba(125, 255, 26, .5); }
  .sw input:checked + span::after { translate: 20px 0; background: var(--lime); }

  .close {
    display: block; width: 100%; margin-top: 10px; padding: 11px;
    border-radius: 12px; border: 1px solid var(--lime);
    background: transparent; color: var(--lime);
    font: inherit; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .close:active { background: rgba(182, 255, 58, .15); }
</style>
</head>
<body>

<button class="bh" id="bh" type="button" aria-label="Открыть настройки" aria-haspopup="dialog">
  <canvas class="infall" aria-hidden="true"></canvas>
  <span class="jet"></span>
  <span class="disk"><i></i></span>
  <span class="lens"></span>
  <span class="core"></span>
  <span class="ring"></span>
  <span class="disk front"><i></i></span>
  <span class="ripple"></span>
</button>

<div class="backdrop" id="backdrop"></div>

<section class="panel" id="panel" role="dialog" aria-label="Настройки">
  <h2>Настройки</h2>

  <label class="row col">
    <div><span>Размер кнопки</span><output id="sizeOut">54</output></div>
    <input type="range" id="size" min="36" max="96" step="2" value="54">
  </label>

  <label class="row col">
    <div><span>Прозрачность</span><output id="opOut">100%</output></div>
    <input type="range" id="op" min="30" max="100" step="5" value="100">
  </label>

  <label class="row">
    <span>Плавать по экрану</span>
    <span class="sw"><input type="checkbox" id="float" checked><span></span></span>
  </label>

  <label class="row col">
    <div><span>Скорость плавания</span><output id="spOut">38</output></div>
    <input type="range" id="speed" min="10" max="120" step="2" value="38">
  </label>

  <label class="row">
    <span>Неоновое кольцо всегда</span>
    <span class="sw"><input type="checkbox" id="ringAlways"><span></span></span>
  </label>

  <label class="row">
    <span>Вибрация при нажатии</span>
    <span class="sw"><input type="checkbox" id="vib" checked><span></span></span>
  </label>

  <button class="close" id="close" type="button">Закрыть</button>
</section>

<script>
(() => {
  const btn = document.getElementById('bh');
  const panel = document.getElementById('panel');
  const backdrop = document.getElementById('backdrop');
  const TAU = Math.PI * 2;
  const TILT = -14 * Math.PI / 180, FLAT = .42;
  const rand = (a, b) => a + Math.random() * (b - a);

  let boost = 0, boostTarget = 0, burst = 0;

  /* =====================================================
     НАСТРОЙКИ
  ===================================================== */
  const $ = id => document.getElementById(id);
  const cfg = { size: 54, op: 100, ringAlways: false, vib: true, float: true, speed: 38 };
  cfg.float = false; cfg.ringAlways = false; cfg.op = 100;   // в приложении кнопка стоит на месте
  const save = () => { try { localStorage.setItem('bh_cfg', JSON.stringify(cfg)); } catch (e) {} };

  function applyCfg(resize) {
    document.documentElement.style.setProperty('--size', cfg.size + 'px');
    btn.style.opacity = cfg.op / 100;
    btn.classList.toggle('ring-always', cfg.ringAlways);
    $('sizeOut').textContent = cfg.size;
    $('opOut').textContent = cfg.op + '%';
    $('spOut').textContent = cfg.speed;
    if (resize) setup();
  }

  $('size').value = cfg.size;
  $('op').value = cfg.op;
  $('float').checked = cfg.float;
  $('speed').value = cfg.speed;
  $('float').addEventListener('change', e => { cfg.float = e.target.checked; save(); });
  $('speed').addEventListener('input', e => { cfg.speed = +e.target.value; applyCfg(false); rescaleVel(); save(); });
  $('ringAlways').checked = cfg.ringAlways;
  $('vib').checked = cfg.vib;

  $('size').addEventListener('input', e => { cfg.size = +e.target.value; applyCfg(true); save(); });
  $('op').addEventListener('input', e => { cfg.op = +e.target.value; applyCfg(false); save(); });
  $('ringAlways').addEventListener('change', e => { cfg.ringAlways = e.target.checked; applyCfg(false); save(); });
  $('vib').addEventListener('change', e => { cfg.vib = e.target.checked; save(); });

  /* =====================================================
     ОТКРЫТЬ / ЗАКРЫТЬ ОКНО
  ===================================================== */
  function setOpen(v) {
    btn.classList.toggle('open', v);
    panel.classList.toggle('show', v);
    backdrop.classList.toggle('show', v);
    boostTarget = v ? 1 : 0;
  }
  $('close').addEventListener('click', () => setOpen(false));
  backdrop.addEventListener('click', () => setOpen(false));
  addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

  btn.addEventListener('click', () => {
    btn.classList.remove('go');
    void btn.offsetWidth;
    btn.classList.add('go');
    burst = 1;
    setTimeout(() => btn.classList.remove('go'), 900);
    if (cfg.vib && navigator.vibrate) navigator.vibrate(15);


    btn.dispatchEvent(new CustomEvent('blackhole:click', { bubbles: true }));
    try {
      if (window.AndroidBridge && AndroidBridge.onBlackHoleClick) AndroidBridge.onBlackHoleClick();
    } catch (e) {}
  });

  /* =====================================================
     ПЛАВАНИЕ ПО ЭКРАНУ
     (стоит на месте, пока кнопку держат пальцем или открыто окно настроек)
  ===================================================== */
  let x = innerWidth * .8, y = innerHeight * .3;
  const a0 = rand(0, TAU);
  let vx = Math.cos(a0), vy = Math.sin(a0);         // единичное направление
  let wobT = 0, pressed = false;

  btn.addEventListener('pointerdown', () => pressed = true);
  addEventListener('pointerup', () => pressed = false);
  addEventListener('pointercancel', () => pressed = false);

  function rescaleVel() {}                          // скорость берётся из cfg.speed каждый кадр

  function place() {
    btn.style.left = x.toFixed(1) + 'px';
    btn.style.top  = y.toFixed(1) + 'px';
  }
  function bounds() {
    const m = (S || btn.clientWidth) * .95;          // отступ, чтобы диск и джеты не обрезались
    return [m, innerWidth - m, m, innerHeight - m];
  }
  function clampPos() {
    const [x0, x1, y0, y1] = bounds();
    x = Math.min(Math.max(x, x0), Math.max(x0, x1));
    y = Math.min(Math.max(y, y0), Math.max(y0, y1));
    place();
  }

  function stepFloat(dt) {
    if (!cfg.float || pressed || panel.classList.contains('show')) return;
    const [x0, x1, y0, y1] = bounds();

    wobT += dt;
    const turn = Math.sin(wobT * .7) * .35 * dt;     // плавное блуждание направления
    const c = Math.cos(turn), s = Math.sin(turn);
    [vx, vy] = [vx * c - vy * s, vx * s + vy * c];

    x += vx * cfg.speed * dt;
    y += vy * cfg.speed * dt + Math.sin(wobT * 1.3) * 10 * dt;

    if (x < x0) { x = x0; vx =  Math.abs(vx); }
    if (x > x1) { x = x1; vx = -Math.abs(vx); }
    if (y < y0) { y = y0; vy =  Math.abs(vy); }
    if (y > y1) { y = y1; vy = -Math.abs(vy); }
    place();
  }

  /* =====================================================
     ВРАЩЕНИЕ КОЛЕЦ
  ===================================================== */
  const diskEls = btn.querySelectorAll('.disk i');
  const lensEl = btn.querySelector('.lens');
  let ang = 0;
  function stepRing(dt) {
    ang = (ang + 51 * dt * (1 + 1.7 * boost + 6 * burst)) % 360;
    const tf = `rotate(${ang.toFixed(2)}deg)`;
    diskEls.forEach(el => el.style.transform = tf);
    lensEl.style.transform = `rotate(${(-ang * .62).toFixed(2)}deg)`;
  }

  /* =====================================================
     ПАДАЮЩИЕ ЧАСТИЦЫ
  ===================================================== */
  const cv = btn.querySelector('.infall');
  const ctx = cv.getContext('2d');
  let S, W, coreR, maxR, parts = [];
  const PAL = [];
  for (const h of [18, 26, 34, 42, 50])
    for (let d = 0; d < 8; d++) PAL.push(`hsl(${h},100%,${55 + 38 * d / 7}%)`);

  function resizeInfall() {
    S = btn.clientWidth; W = S * 2.6;
    const dp = Math.min(devicePixelRatio || 1, 2);
    cv.width = cv.height = Math.round(W * dp);
    cv.style.width = cv.style.height = W + 'px';
    ctx.setTransform(dp, 0, 0, dp, 0, 0);
    coreR = S * .22; maxR = W / 2;
  }
  const spawn = (p, anywhere) => {
    p.r = anywhere ? rand(coreR * 1.2, maxR) : rand(maxR * .55, maxR);
    p.a = rand(0, TAU); p.t = anywhere ? 1 : 0;
    p.hi = (Math.random() * 5) | 0; p.k = rand(.7, 1.3);
    return p;
  };
  function stepInfall(dt) {
    const k = 1 + 3.2 * boost + 9 * burst;
    const sc = S / 170;                                   // скорость и толщина привязаны к размеру кнопки
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(W / 2, W / 2); ctx.rotate(TILT); ctx.scale(1, FLAT);
    ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1, 1.7 * Math.sqrt(sc));
    for (const p of parts) {
      p.t += dt;
      p.r -= (8 + 4000 / p.r) * sc * k * p.k * dt * 1.6;
      p.a += 2.2 * Math.pow(100 / p.r * sc, 1.5) * (.6 + .4 * k) * dt;
      if (p.r < coreR * 1.02) { spawn(p, false); continue; }
      const depth = 1 - (p.r - coreR) / (maxR - coreR);
      const edge = Math.min(1, (p.r - coreR) / (coreR * .6));
      const trail = .10 + .08 * boost + .12 * burst;
      ctx.globalAlpha = Math.min(1, p.t) * edge * (.35 + .65 * depth);
      ctx.strokeStyle = PAL[p.hi * 8 + Math.min(7, (depth * 8) | 0)];
      ctx.beginPath();
      ctx.moveTo(Math.cos(p.a - trail) * (p.r + trail * 5), Math.sin(p.a - trail) * (p.r + trail * 5));
      ctx.lineTo(Math.cos(p.a) * p.r, Math.sin(p.a) * p.r);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* =====================================================
     ЗАПУСК
  ===================================================== */
  function setup() {
    resizeInfall();
    parts = Array.from({ length: 70 }, () => spawn({}, true));
    clampPos();
  }
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(setup, 120); });

  applyCfg(false);
  setup();

  let last = performance.now();
  const loop = now => {
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    boost += (boostTarget - boost) * Math.min(1, dt * 4);
    burst *= Math.pow(.02, dt);
    stepFloat(dt);
    stepRing(dt);
    stepInfall(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
